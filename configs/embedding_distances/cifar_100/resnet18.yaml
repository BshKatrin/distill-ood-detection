experiment_name: embedding_distances_resnet18_cifar100
run_dir: runs/embedding_distances/cifar_100/resnet18
device: auto
seed: 42

dataset:
  name: cifar100
  data_dir: data
  batch_size: 256
  num_workers: 4
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar10
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar100
  revision: main
  num_classes: 100

layers:
  - layer1
  - layer2
  - layer3
  - layer4
k_neighbors: 10
embedding_shard_size: 4096
query_block_size: 1024
reference_block_size: 8192
standardization_epsilon: 1.0e-6
