experiment_name: perturbation_linear_layer4_student_resnet18_cifar10_clip_spatial
output_dir: runs

dataset:
  name: cifar10
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar100
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar10
  revision: main

student:
  kind: linear
  feature_layer: layer4
  input_shape: [8208] # 512 * 4 * 4 + 4 * 4
  num_classes: 10

strategy:
  name: perturbation
  perturbation:
    u_min: 0.5
    u_max: 1.0
    clipping_mode: spatial_dependent
    evaluation_draws: 50

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  # cross_entropy:
  #   name: sgd
  #   learning_rate: 0.005
  #   momentum: 0.9
  #   weight_decay: 0.001
  kl_divergence:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}
    # cross_entropy:
    #   temperature: 4.0
    #   alpha: 0.8
    kl_divergence: {}

mlflow:
  enabled: true
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
