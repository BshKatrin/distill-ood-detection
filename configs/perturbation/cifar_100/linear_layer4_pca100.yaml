experiment_name: perturbation_linear_layer4_student_resnet18_cifar100_pca100
output_dir: runs

dataset:
  name: cifar100
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar10
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar100
  revision: main
  num_classes: 100

student:
  kind: linear
  feature_layer: layer4
  input_shape: [100]
  num_classes: 100

strategy:
  name: perturbation
  perturbation:
    method: pca_projection
    pca_components: 100
    pca_activation_path: runs/teacher_resnet18_cifar100/teacher_activations/cifar100_train/layer4.pt

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  kl_divergence:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}
    kl_divergence: {}

mlflow:
  enabled: true
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
