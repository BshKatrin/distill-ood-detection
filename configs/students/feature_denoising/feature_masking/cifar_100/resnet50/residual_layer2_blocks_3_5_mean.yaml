experiment_name: feature_denoising_spatial_block_residual_layer2_resnet50_cifar100_blocks_3_5_mean
run_dir: runs/students/feature_denoising/feature_masking/cifar_100/resnet50/residual_layer2_blocks_3_5_mean

dataset:
  name: cifar100
  data_dir: data
  batch_size: 128
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar10
      split: test

teacher:
  hf_model_id: edadaltocg/resnet50_cifar100
  revision: main
  num_classes: 100

student:
  kind: feature_residual_denoiser
  feature_layer: layer2
  input_shape: [513, 16, 16]
  hidden_channels: [64]
  num_classes: 512

strategy:
  name: feature_denoising
  feature_denoising:
    method: spatial_block_residual_reconstruction
    spatial_mask_block_sizes: [3, 5]
    evaluation_draws: 10

optimizer:
  pca_masked_reconstruction:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001

training:
  defaults:
    epochs: 50
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}

mlflow:
  enabled: false

