experiment_name: feature_denoising_confusion_channel_replacement_residual_layer4_resnet18_cifar10_p020
run_dir: runs/students/feature_denoising/feature_masking/cifar_10/resnet18/confusion_channel_replacement_residual_layer4_p020

dataset:
  name: cifar10
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - {name: mnist, split: test}
    - {name: svhn, split: test}
    - {name: cifar100, split: test}

teacher:
  hf_model_id: edadaltocg/resnet18_cifar10
  revision: main
  num_classes: 10

student:
  kind: feature_residual_denoiser
  feature_layer: layer4
  input_shape: [512, 4, 4]
  num_classes: 512

strategy:
  name: feature_denoising
  feature_denoising:
    method: confusion_channel_replacement_residual_reconstruction
    mask_probability: 0.2
    prototype_count: 50
    class_statistics_epsilon: 0.000001
    confusion_split: test
    evaluation_draws: 10

optimizer:
  pca_masked_reconstruction:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001

training:
  defaults:
    epochs: 50
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}

mlflow:
  enabled: false
