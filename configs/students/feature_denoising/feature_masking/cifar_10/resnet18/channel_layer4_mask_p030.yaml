experiment_name: feature_denoising_channel_layer4_student_resnet18_cifar10_mask_p030
run_dir: runs/students/feature_denoising/feature_masking/cifar_10/resnet18/channel_layer4_mask_p030

dataset:
  name: cifar10
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar100
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar10
  revision: main
  num_classes: 10

student:
  kind: feature_reconstructor
  feature_layer: layer4
  input_shape: [512, 4, 4]
  hidden_channels: [256, 2]
  num_classes: 512

strategy:
  name: feature_denoising
  feature_denoising:
    method: channel_masked_reconstruction
    activation_path: runs/teachers/cifar_10/resnet18/teacher_activations/cifar10_train/layer4.pt
    mask_probability: 0.3
    evaluation_draws: 10

optimizer:
  pca_masked_reconstruction:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001

training:
  defaults:
    epochs: 50
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}

mlflow:
  enabled: true
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
