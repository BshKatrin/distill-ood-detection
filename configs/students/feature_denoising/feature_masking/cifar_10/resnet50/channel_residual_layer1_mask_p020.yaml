experiment_name: feature_denoising_channel_residual_layer1_resnet50_cifar10_mask_p020
run_dir: runs/students/feature_denoising/feature_masking/cifar_10/resnet50/channel_residual_layer1_mask_p020

dataset:
  name: cifar10
  data_dir: data
  batch_size: 128
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - {name: mnist, split: test}
    - {name: svhn, split: test}
    - {name: cifar100, split: test}

teacher:
  hf_model_id: edadaltocg/resnet50_cifar10
  revision: main
  num_classes: 10

student:
  kind: feature_residual_denoiser
  feature_layer: layer1
  input_shape: [256, 32, 32]
  hidden_channels: [64]
  num_classes: 256

strategy:
  name: feature_denoising
  feature_denoising:
    method: channel_masked_residual_reconstruction
    mask_probability: 0.2
    evaluation_draws: 10

optimizer:
  pca_masked_reconstruction:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001

training:
  defaults:
    epochs: 50
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}

mlflow:
  enabled: false

