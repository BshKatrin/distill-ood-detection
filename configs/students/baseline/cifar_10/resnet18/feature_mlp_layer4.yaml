experiment_name: feature_mlp_layer4_student_resnet18_cifar10
run_dir: runs/students/baseline/cifar_10/resnet18/feature_mlp_layer4

dataset:
  name: cifar10
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar100
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar10
  revision: main

student:
  kind: mlp
  feature_layer: layer4
  input_shape: [512, 4, 4]
  hidden_channels: [1024, 512, 256]
  num_classes: 10

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  cross_entropy:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 50
    seed: 42
    device: cuda
    log_every_steps: 50
  methods:
    mse_logits: {}
    cross_entropy:
      temperature: 4.0
      alpha: 0.8

mlflow:
  enabled: true
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
