experiment_name: feature_mlp_layer3_student_resnet18_cifar100
run_dir: runs/students/baseline/cifar_100/resnet18/feature_mlp_layer3

dataset:
  name: cifar100
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: cifar10
      split: test
    - name: mnist
      split: test
    - name: svhn
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar100
  revision: main
  num_classes: 100

student:
  kind: mlp
  feature_layer: layer3
  input_shape: [256, 8, 8]
  hidden_channels: [1024, 512, 256]
  num_classes: 100

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  cross_entropy:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}
    cross_entropy:
      temperature: 4.0
      alpha: 0.8

mlflow:
  enabled: false
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
