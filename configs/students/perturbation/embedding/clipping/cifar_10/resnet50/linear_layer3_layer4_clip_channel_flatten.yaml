experiment_name: perturbation_linear_layer3_layer4_student_resnet50_cifar10_clip_channel_flatten
run_dir: runs/students/perturbation/embedding/clipping/cifar_10/resnet50/linear_layer3_layer4_clip_channel_flatten

dataset:
  name: cifar10
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar100
      split: test

teacher:
  hf_model_id: edadaltocg/resnet50_cifar10
  revision: main
  num_classes: 10

student:
  kind: linear
  input_shape: [35840] # 32768 flattened layer4 features + 3072 layer3/layer4 percentiles
  num_classes: 10

strategy:
  name: perturbation
  perturbation:
    teacher_target: clean
    method: clipping
    embedding_pool: flatten
    clipping_layers:
      layer3:
        clipping_mode: channel_dependent
        u_min: 0.5
        u_max: 1.0
      layer4:
        clipping_mode: channel_dependent
        u_min: 0.5
        u_max: 1.0
    evaluation_draws: 50

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  kl_divergence:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}
    kl_divergence: {}

mlflow:
  enabled: false
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
