experiment_name: perturbation_linear_layer3_student_resnet18_cifar100_clip_constant_aggressive_perturbed
run_dir: runs/students/perturbation/embedding/clipping/cifar_100/resnet18/linear_layer3_clip_constant_aggressive_perturbed

dataset:
  name: cifar100
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar10
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar100
  revision: main
  num_classes: 100

student:
  kind: linear
  input_shape: [8193] # 8192 final layer4 features + 1 layer3 percentiles
  num_classes: 100

strategy:
  name: perturbation
  perturbation:
    teacher_target: perturbed
    method: clipping
    embedding_pool: flatten
    clipping_layers:
      layer3:
        clipping_mode: constant
        u_min: 0.0
        u_max: 0.5
    evaluation_draws: 50

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  cross_entropy:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  kl_divergence:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}
    cross_entropy:
      temperature: 4.0
      alpha: 0.8
    kl_divergence: {}

mlflow:
  enabled: true
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
