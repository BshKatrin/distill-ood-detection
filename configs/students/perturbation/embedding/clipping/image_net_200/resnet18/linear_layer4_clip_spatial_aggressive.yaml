experiment_name: perturbation_linear_layer4_student_resnet18_imagenet200_clip_spatial_aggressive
run_dir: runs/students/perturbation/embedding/clipping/image_net_200/resnet18/linear_layer4_clip_spatial_aggressive

dataset:
  name: imagenet200
  data_dir: /data/common/ImageNet
  batch_size: 128
  num_workers: 8
  image_lists:
    train:
      imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/train_imagenet200.txt
      data_dir: /data/common/ImageNet
      strip_prefix: imagenet_1k
    validation:
      imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/val_imagenet200.txt
      data_dir: /data/common/ImageNet
      strip_prefix: imagenet_1k
      basename_search_dir: val
    test:
      imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/test_imagenet200.txt
      data_dir: /data/common/ImageNet
      strip_prefix: imagenet_1k
      basename_search_dir: val
  ood_datasets:
    - name: ssb_hard
      split: test
      group: near
      image_list:
        imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/test_ssb_hard.txt
        data_dir: /home/bogush/openood/data/images_largescale
    - name: ninco
      split: test
      group: near
      image_list:
        imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/test_ninco.txt
        data_dir: /home/bogush/openood/data/images_largescale
    - name: inaturalist
      split: test
      group: far
      image_list:
        imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/test_inaturalist.txt
        data_dir: /home/bogush/openood/data/images_largescale
    - name: textures
      split: test
      group: far
      image_list:
        imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/test_textures.txt
        data_dir: /data/common/dataset_suite/dtddataset/dtd/images
        strip_prefix: texture
    - name: openimage_o
      split: test
      group: far
      image_list:
        imglist_path: /home/bogush/openood/data/benchmark_imglist/imagenet200/test_openimage_o.txt
        data_dir: /home/bogush/openood/data/images_largescale

teacher:
  hf_model_id: openood/imagenet200_resnet18
  architecture: resnet18_imagenet
  checkpoint_path: /home/bogush/openood/results/imagenet200_resnet18_224x224_base_e90_lr0.1_default/s0/best.ckpt
  num_classes: 200

student:
  kind: linear
  input_shape: [25137]
  num_classes: 200

strategy:
  name: perturbation
  perturbation:
    method: clipping
    teacher_target: clean
    embedding_pool: flatten
    clipping_layers:
      layer4:
        clipping_mode: spatial_dependent
        u_min: 0.0
        u_max: 0.5
    evaluation_draws: 50

optimizer:
  kl_divergence:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 0
    device: auto
    log_every_steps: 50
  methods:
    kl_divergence: {}

mlflow:
  enabled: false
