experiment_name: perturbation_linear_layer4_student_resnet50_cifar100_pca100_mask_p070
run_dir: runs/students/perturbation/embedding/pca/cifar_100/resnet50/linear_layer4_pca100_mask_p070

dataset:
  name: cifar100
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar10
      split: test

teacher:
  hf_model_id: edadaltocg/resnet50_cifar100
  revision: main
  num_classes: 100

student:
  kind: linear
  feature_layer: layer4
  input_shape: [200]
  num_classes: 100

strategy:
  name: perturbation
  perturbation:
    teacher_target: clean
    method: pca_masked_projection
    pca_components: 100
    pca_mask_probability: 0.7
    pca_activation_path: runs/teachers/cifar_100/resnet50/teacher_activations/cifar100_train/layer4.pt

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  cross_entropy:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  kl_divergence:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}
    cross_entropy:
      temperature: 4.0
      alpha: 0.8
    kl_divergence: {}

mlflow:
  enabled: false
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
