experiment_name: linear_layer4_pixmix_avg_student_resnet50_cifar10
run_dir: runs/students/perturbation/pixel/pixmix/cifar_10/resnet50/linear_layer4_pixmix_avg

dataset:
  name: cifar10
  data_dir: data
  batch_size: 256
  num_workers: 4
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar100
      split: test

teacher:
  hf_model_id: edadaltocg/resnet50_cifar10
  revision: main
  num_classes: 10

student:
  kind: linear
  feature_layer: layer4
  input_shape: [2048]
  num_classes: 10

strategy:
  name: perturbation
  perturbation:
    method: pixmix
    teacher_target: perturbed
    embedding_pool: avg
    evaluation_draws: 16
    pixmix:
      mixing_set_path: pixmix/fractals_and_fvis
      mixing_iterations: 4
      beta: 3.0
      augmentation_severity: 3.0
      all_ops: true
      working_size: 32

optimizer:
  mse_logits:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001
  cross_entropy:
    name: sgd
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.001

training:
  defaults:
    epochs: 30
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}
    cross_entropy:
      temperature: 4.0
      alpha: 0.8

mlflow:
  enabled: false
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///mlflow.db
