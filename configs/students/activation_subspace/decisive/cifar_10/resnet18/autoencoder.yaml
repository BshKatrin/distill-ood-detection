experiment_name: activation_subspace_decisive_autoencoder_resnet18_cifar10
run_dir: runs/students/activation_subspace/decisive/cifar_10/resnet18/autoencoder

dataset:
  name: cifar10
  data_dir: data
  batch_size: 256
  num_workers: 2
  validation_fraction: 0.1
  ood_datasets:
    - name: mnist
      split: test
    - name: svhn
      split: test
    - name: cifar100
      split: test

teacher:
  hf_model_id: edadaltocg/resnet18_cifar10
  revision: main
  num_classes: 10

student:
  kind: autoencoder
  feature_layer: layer4
  input_shape: [7]
  hidden_channels: [4]
  num_classes: 7

strategy:
  name: activation_subspace
  activation_subspace:
    component: decisive
    target: coordinates
    expected_dimension: 7
    embedding_pool: avg

optimizer:
  activation_subspace:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001

training:
  defaults:
    epochs: 50
    seed: 42
    device: auto
    log_every_steps: 50
  methods:
    mse_logits: {}

mlflow:
  enabled: false
  experiment_name: distill-ood-detection
  tracking_uri: sqlite:///runs/students/activation_subspace/decisive/cifar_10/resnet18/autoencoder/mlflow.db
