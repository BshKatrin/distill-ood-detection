[project]
name = "distill-ood-detection-dashboard-env"
version = "0.1.0"
description = "Locked CPU environment for the channel-cluster audit dashboard."
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.8.2,<3.9",
    "numpy>=2.4.6",
    "pandas>=3.0.1",
    "panel>=1.8.9,<1.9",
    "pyarrow>=23.0.1",
    "pytest>=8.4.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.12.0; sys_platform == 'darwin'",
    "torch>=2.11.0,<2.12.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
