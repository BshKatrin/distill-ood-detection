[project]
name = "distill-ood-detection"
version = "0.1.0"
description = "Model distillation experiments for OOD detection."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[project.scripts]
distill-ood = "distill_ood_detection.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
