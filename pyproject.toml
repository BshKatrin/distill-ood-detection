[project]
name = "distill-ood-detection"
version = "0.1.0"
description = "Model distillation experiments for OOD detection."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.17.0",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "torch>=2.12.0; sys_platform == 'darwin'",
    "torch>=2.11.0,<2.12.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision>=0.27.0; sys_platform == 'darwin'",
    "torchvision>=0.26.0,<0.27.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tqdm>=4.67.3",
    "mlflow>=3.13.0",
    "ipykernel>=7.2.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.9",
]

[project.scripts]
distill-ood = "distill_ood_detection.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
